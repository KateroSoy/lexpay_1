<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEXPAY | Everything you need. One LEX away.</title>
    <meta name="description" content="Products, services, payments, and everyday essentials — all in one place." />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
    <meta property="og:title" content="LEXPAY" />
    <meta property="og:description" content="Products, services, payments, and everyday essentials — all in one place." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Fix for AI Studio preview iframe setting fetch as getter-only, which breaks some router/fetch polyfills -->
    <script>
      try {
        var originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          value: originalFetch,
          writable: true,
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.warn('Could not make fetch writable:', e);
      }
    </script>
    <div id="root"></div>
    <div id="error-log" style="position: fixed; z-index: 9999; top: 0; left: 0; background: red; color: white; padding: 10px; display: none; max-width: 100vw; overflow: auto; max-height: 50vh;"></div>
    
    <script>
      window.addEventListener('error', function(e) {
        var log = document.getElementById('error-log');
        log.style.display = 'block';
        log.innerText += '\n' + e.message + '\n' + (e.error ? e.error.stack : '');
      });
      window.addEventListener('unhandledrejection', function(e) {
        var log = document.getElementById('error-log');
        log.style.display = 'block';
        log.innerText += '\n' + e.reason;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
